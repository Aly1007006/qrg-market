packages:
  - apps/*
minimumReleaseAge: 1440
strictPeerDependencies: true
engineStrict: true
saveExact: true
# Nest 12.0.1 pins vulnerable Multer 2.2.0. Remove after its upstream pin is fixed.
# GHSA-wc9g-mqfw-jrwm / GHSA-qfvm-cv95-jqjf / GHSA-535w-7cp7-47q4.
overrides:
  '@nestjs/platform-express@12.0.1>multer': 2.5.0
  body-parser: 2.4.0
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
allowBuilds:
  argon2: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  '@scarf/scarf': false
