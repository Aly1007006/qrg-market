name: qrg-market-local
services:
  storage:
    image: chrislusf/seaweedfs:4.46
    command: [mini, '-dir=/data']
    environment:
      AWS_ACCESS_KEY_ID: qrg-local-only
      AWS_SECRET_ACCESS_KEY: local-storage-only-change-me
      S3_BUCKET: qrg-local-images
    ports: ['127.0.0.1:8333:8333']
    volumes: [media_data:/data]
    networks: [application]
    security_opt: ['no-new-privileges:true']
  db:
    build: ./infra/postgres
    image: qrg-postgres:17-local
    environment:
      POSTGRES_USER: qrg_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local-only POSTGRES_PASSWORD in .env}
      POSTGRES_DB: qrg_market
    volumes:
      - postgres17_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-qrg.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U qrg_local -d qrg_market']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]
  api:
    profiles: [app]
    image: qrg-market-local-api
    build:
      context: .
      target: api
    # Local Docker has no DB TLS; production config strictly requires TLS.
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://qrg_local:${POSTGRES_PASSWORD}@db:5432/qrg_market
      DATABASE_SSL: 'false'
      SWAGGER_ENABLED: 'true'
      APP_ORIGIN: http://localhost:3000
      ADMIN_MFA_ENCRYPTION_KEY: ${ADMIN_MFA_ENCRYPTION_KEY:-}
      S3_ENDPOINT: http://storage:8333
      S3_REGION: us-east-1
      S3_BUCKET: qrg-local-images
      S3_ACCESS_KEY_ID: qrg-local-only
      S3_SECRET_ACCESS_KEY: local-storage-only-change-me
      S3_FORCE_PATH_STYLE: 'true'
    ports: ['127.0.0.1:3001:3001']
    depends_on:
      storage:
        condition: service_started
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 8s
      retries: 5
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [database, application]
  migrate:
    profiles: [app]
    image: qrg-market-local-api
    build:
      context: .
      target: api
    command: [node, apps/api/dist/db/migrate-main.js]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://qrg_local:${POSTGRES_PASSWORD}@db:5432/qrg_market
      DATABASE_SSL: 'false'
      SWAGGER_ENABLED: 'false'
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [database]
  web:
    profiles: [app]
    environment:
      QRG_API_ORIGIN: http://api:3001
      QRG_APP_ORIGIN: http://localhost:3000
      QRG_DEV_FIXTURES: 'false'
      QRG_MEDIA_ORIGIN: ${QRG_MEDIA_ORIGIN:-}
    build:
      context: .
      target: web
      args:
        QRG_MEDIA_ORIGIN: ${QRG_MEDIA_ORIGIN:-}
    ports: ['127.0.0.1:3000:3000']
    init: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [application]
networks:
  database:
    internal: true
  application:
volumes:
  media_data:
  postgres17_data:
