name: Quality gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://qrg_local:local-only-change-me@127.0.0.1:5432/qrg_market_test
      DATABASE_SSL: 'false'
      QRG_INTERNAL_PROXY_SECRET: ci-only-internal-proxy-secret-at-least-32-characters
      INTERNAL_PROXY_SECRET: ci-only-internal-proxy-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.26.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scan repository for secrets and IaC misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: node_modules,apps/web/.next,.tools
      - run: pnpm source:check
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Start disposable PostgreSQL with PostGIS and pg_trgm
        run: docker compose --env-file .env.example -f compose.yaml -f compose.host.yaml up -d --build --wait db storage
      - run: pnpm db:migrate
      - run: pnpm test:db
      - run: pnpm test:requests
      - run: pnpm test:admin
      - run: pnpm test:operations
      - run: pnpm test:admin-control
      - run: pnpm test:subscriptions
      - run: pnpm test:payments
      - run: pnpm test:media
        env: &local-media
          S3_ENDPOINT: http://127.0.0.1:8333
          S3_REGION: us-east-1
          S3_BUCKET: qrg-local-images
          S3_ACCESS_KEY_ID: qrg-local-only
          S3_SECRET_ACCESS_KEY: local-storage-only-change-me
          S3_FORCE_PATH_STYLE: 'true'
      - run: pnpm build
      - run: pnpm source:check
      - name: Verify build did not mutate tracked files
        run: git diff --exit-code -- .
      - run: pnpm test:admin-control
        env:
          QRG_TEST_BUILT_ADMIN_CONTROL: 'true'
      - run: pnpm test:analytics
      - run: pnpm test:requests:smoke
      - run: pnpm test:admin:smoke
      - run: pnpm test:subscriptions:smoke
      - run: pnpm test:seller:smoke
        env: *local-media
      - run: pnpm test:smoke
      - run: pnpm test:catalog:smoke
      - run: pnpm test:web:preview
      - run: pnpm audit --prod --audit-level=high
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Validate production Terraform
        working-directory: infra/terraform/environments/production
        run: |
          terraform fmt -check -recursive ../../..
          terraform init -backend=false -input=false
          terraform validate
      - name: Build production images
        run: |
          docker build --target api -t qrg-api:${{ github.sha }} .
          docker build --target web -t qrg-web:${{ github.sha }} .
      - name: Scan API production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qrg-api:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan web production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qrg-web:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Stop local services
        if: always()
        run: docker compose --env-file .env.example -f compose.yaml -f compose.host.yaml down
